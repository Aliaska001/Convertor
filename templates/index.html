<!doctype html>
<html lang="ro">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convertor YouTube in MP3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>

  <body>
    <main class="shell">
      <section class="panel">
        <form method="post" class="converter-form">
          <label for="video_url">Link video YouTube</label>
          <div class="input-row">
            <input
              id="video_url"
              name="video_url"
              type="url"
              placeholder="https://www.youtube.com/watch?v=..."
              required
              autocomplete="off"
            >
            <button type="submit">Converteste</button>
          </div>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="messages">
              {% for category, message in messages %}
                <p class="message {{ category }}">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% if converted_file %}
          <div class="result">
            <div>
              <p class="result-label">Conversie finalizata</p>
              <h2>{{ converted_title }}</h2>
            </div>
            <a class="download-button" href="{{ url_for('download', filename=converted_file) }}">Descarca MP3</a>
          </div>
        {% endif %}
        
      </section>
    </main>
  </body>
</html>
